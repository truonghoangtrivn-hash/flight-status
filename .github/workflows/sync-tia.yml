name: Auto Sync TIA Airport Flights

on:
  schedule:
    # CHẠY TỐI ĐA TOÀN BỘ 24/7 CẢ NGÀY LẪN ĐÊM: MỖI 5 PHÚT MỘT LẦN SUỐT 365 NGÀY
    # (Vì kho mã là PUBLIC nên GitHub cho phép chạy không giới hạn số phút, miễn phí 100%)
    - cron: '*/5 * * * *'

  workflow_dispatch:

jobs:
  scrape-tia:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 1. Tải mã nguồn dự án
        uses: actions/checkout@v4

      - name: 2. Cài đặt môi trường Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Cài đặt Puppeteer và Firebase
        run: |
          npm install puppeteer firebase

      - name: 4. Chạy cào song song TIA và đẩy vào Firebase
        run: |
          node scripts/crawl-tia.mjs